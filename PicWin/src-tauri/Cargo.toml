[package]
name = "pic"
version = "1.1.0"
description = "Pic for Windows"
authors = ["crl"]
edition = "2021"
license = "UNLICENSED"

[lib]
name = "pic_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
